<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#1e1b4b;#0f172a" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#1e293b">
        <animate attributeName="stop-color" values="#1e293b;#311b92;#1e293b" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0284c7">
        <animate attributeName="stop-color" values="#0284c7;#4338ca;#0284c7" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 52px; fill: url(#text-grad); }
      .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 22px; fill: #94a3b8; }
      .badge { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
      .pulse-ring { animation: pulse 3s infinite ease-in-out; transform-origin: center; }
      @keyframes pulse {
        0% { transform: scale(0.98); opacity: 0.8; }
        50% { transform: scale(1.02); opacity: 1; }
        100% { transform: scale(0.98); opacity: 0.8; }
      }
    </style>
  </defs>

  <!-- Dynamic Animated Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)" />

  <!-- Decorative Grid Overlay -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="200" y1="0" x2="200" y2="320" />
    <line x1="400" y1="0" x2="400" y2="320" />
    <line x1="600" y1="0" x2="600" y2="320" />
    <line x1="800" y1="0" x2="800" y2="320" />
    <line x1="1000" y1="0" x2="1000" y2="320" />
  </g>

  <!-- Dynamic Floating Circles -->
  <circle cx="150" cy="80" r="120" fill="#38bdf8" fill-opacity="0.05" class="pulse-ring" />
  <circle cx="1050" cy="220" r="150" fill="#c084fc" fill-opacity="0.05" class="pulse-ring" />

  <!-- Main Banner Icon Graphic -->
  <g transform="translate(100, 100)" filter="url(#glow)">
    <rect x="0" y="0" width="120" height="120" rx="24" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <!-- Shield / Scale Icon -->
    <path d="M60 25 L90 40 V65 C90 85 60 100 60 100 C60 100 30 85 30 65 V40 Z" fill="none" stroke="url(#text-grad)" stroke-width="4" stroke-linejoin="round" />
    <path d="M45 60 L55 70 L75 50" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Banner Content Text -->
  <text x="250" y="130" class="title" filter="url(#glow)">Awesome Probation Management ⚖️</text>
  <text x="250" y="175" class="subtitle">Probation & Parole Case Management • Electronic Monitoring • Offender Supervision</text>

  <!-- Tag Pill Badges -->
  <g transform="translate(250, 210)">
    <rect x="0" y="0" width="140" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.4" />
    <text x="70" y="22" text-anchor="middle" class="badge">🔒 Compliance</text>

    <rect x="155" y="0" width="160" height="34" rx="17" fill="#0f172a" stroke="#818cf8" stroke-opacity="0.4" />
    <text x="235" y="22" text-anchor="middle" class="badge" fill="#818cf8">📡 GPS Tracking</text>

    <rect x="330" y="0" width="160" height="34" rx="17" fill="#0f172a" stroke="#c084fc" stroke-opacity="0.4" />
    <text x="410" y="22" text-anchor="middle" class="badge" fill="#c084fc">🏛️ Justice Tech</text>

    <rect x="505" y="0" width="160" height="34" rx="17" fill="#0f172a" stroke="#34d399" stroke-opacity="0.4" />
    <text x="585" y="22" text-anchor="middle" class="badge" fill="#34d399">🌐 Open Source</text>
  </g>
</svg>
