<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 48px; fill: url(#text-grad); }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; dominant-baseline: central; text-anchor: middle; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)" />

  <!-- Decorative Grid Overlay -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="200" y1="0" x2="200" y2="320" />
    <line x1="400" y1="0" x2="400" y2="320" />
    <line x1="600" y1="0" x2="600" y2="320" />
    <line x1="800" y1="0" x2="800" y2="320" />
    <line x1="1000" y1="0" x2="1000" y2="320" />
  </g>

  <!-- Background Glow Orbs -->
  <circle cx="150" cy="80" r="120" fill="#38bdf8" fill-opacity="0.06" />
  <circle cx="1050" cy="220" r="150" fill="#c084fc" fill-opacity="0.06" />

  <!-- Icon Box Graphic -->
  <g transform="translate(90, 100)" filter="url(#glow)">
    <rect x="0" y="0" width="120" height="120" rx="24" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <path d="M60 25 L90 40 V65 C90 85 60 100 60 100 C60 100 30 85 30 65 V40 Z" fill="none" stroke="url(#text-grad)" stroke-width="4" stroke-linejoin="round" />
    <path d="M45 60 L55 70 L75 50" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Banner Content Text -->
  <text x="240" y="125" class="title" filter="url(#glow)">Awesome Probation Management ⚖️</text>
  <text x="240" y="165" class="subtitle">Probation &amp; Parole Case Management • Electronic Monitoring • Offender Supervision</text>

  <!-- Tag Pill Badges -->
  <g transform="translate(240, 200)">
    <!-- Badge 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="135" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.5" />
      <text x="67.5" y="17" class="badge-text" fill="#38bdf8">🔒 Compliance</text>
    </g>

    <!-- Badge 2 -->
    <g transform="translate(150, 0)">
      <rect x="0" y="0" width="155" height="34" rx="17" fill="#0f172a" stroke="#818cf8" stroke-opacity="0.5" stroke-width="1.5" />
      <text x="77.5" y="17" class="badge-text" fill="#818cf8">📡 GPS Tracking</text>
    </g>

    <!-- Badge 3 -->
    <g transform="translate(320, 0)">
      <rect x="0" y="0" width="150" height="34" rx="17" fill="#0f172a" stroke="#c084fc" stroke-opacity="0.5" stroke-width="1.5" />
      <text x="75" y="17" class="badge-text" fill="#c084fc">🏛️ Justice Tech</text>
    </g>

    <!-- Badge 4 -->
    <g transform="translate(485, 0)">
      <rect x="0" y="0" width="155" height="34" rx="17" fill="#0f172a" stroke="#34d399" stroke-opacity="0.5" stroke-width="1.5" />
      <text x="77.5" y="17" class="badge-text" fill="#34d399">🌐 Open Source</text>
    </g>
  </g>
</svg>
